name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Cambia a tu versión de Python si es diferente
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest pytest-cov
          # Si tienes un requirements.txt o pyproject.toml con dependencias propias, des comenta la siguiente línea:
          # pip install .

      - name: 1. Ejecutar Ruff (Linter)
        run: |
          ruff check src/ test/

      - name: 2. Ejecutar Bandit (Seguridad)
        run: |
          bandit -r src/

      - name: 3. Ejecutar Pytest (Pruebas unitarias)
        run: |
          pytest
